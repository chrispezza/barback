<!-- @dsCard group="Spacing" viewport="700x170" name="Targets in use" subtitle="44px minimum tap target, 56px shelf row, 20/32px gutters" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--green-900);color:var(--cream-100);font-family:var(--font-body);padding:18px 22px}
.sw{display:flex;gap:0}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;border-radius:2px}
.hex{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;opacity:0.9}
.tok{font-size:10px;letter-spacing:0.06em;opacity:0.75;margin-top:2px}
.cap{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.10em;color:var(--cream-400)}
.mut{color:var(--cream-400);font-size:13px}
</style></head><body><div style="display:flex;gap:24px;align-items:flex-start">
<div><div style="width:150px;height:44px;border:1px solid var(--rule-hairline);display:flex;align-items:center;justify-content:center;font-style:italic;color:var(--cream-100)">Lime juice</div><div class="tok" style="color:var(--cream-400);margin-top:8px">--tap-min 44px</div></div>
<div><div style="width:260px;height:56px;border-bottom:1px solid var(--rule-faint);display:flex;flex-direction:column;justify-content:center"><span style="font-style:italic;font-size:17px">Rye whiskey</span><span style="font-size:13px;color:var(--cream-400)">Rittenhouse · ¾ left</span></div><div class="tok" style="color:var(--cream-400);margin-top:8px">--row-height 56px</div></div>
<div><div style="width:120px;height:56px;border-left:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong);position:relative"><div style="position:absolute;inset:0 20px;background:var(--brass-wash)"></div></div><div class="tok" style="color:var(--cream-400);margin-top:8px">--gutter-mobile 20px</div></div>
</div></body></html>
