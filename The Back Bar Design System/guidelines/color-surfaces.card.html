<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces" subtitle="Ballroom green: app background and raised card" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--green-900);color:var(--cream-100);font-family:var(--font-body);padding:18px 22px}
.sw{display:flex;gap:0}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;border-radius:2px}
.hex{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;opacity:0.9}
.tok{font-size:10px;letter-spacing:0.06em;opacity:0.75;margin-top:2px}
.cap{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.10em;color:var(--cream-400)}
.mut{color:var(--cream-400);font-size:13px}
</style></head><body><div class="sw" style="gap:2px">
<div style="background:var(--green-900);border:1px solid var(--rule-faint)"><span class="hex" style="color:var(--cream-100)">#122E26</span><span class="tok" style="color:var(--cream-400)">--green-900 · app background</span></div>
<div style="background:var(--green-800);border:1px solid var(--rule-hairline)"><span class="hex" style="color:var(--cream-100)">#1E4438</span><span class="tok" style="color:var(--cream-400)">--green-800 · card surface</span></div>
<div style="background:var(--surface-inset);border:1px solid var(--rule-faint)"><span class="hex" style="color:var(--cream-100)">#0E241E</span><span class="tok" style="color:var(--cream-400)">--surface-inset · wells</span></div>
</div></body></html>
