<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--green-900);color:var(--cream-100);font-family:var(--font-body);padding:18px 22px}
.sw{display:flex;gap:0}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;border-radius:2px}
.hex{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;opacity:0.9}
.tok{font-size:10px;letter-spacing:0.06em;opacity:0.75;margin-top:2px}
.cap{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.10em;color:var(--cream-400)}
.mut{color:var(--cream-400);font-size:13px}
</style></head><body><div style="display:flex;align-items:flex-end;gap:10px">
<div style="text-align:center"><div style="width:4px;height:4px;background:var(--brass-500)"></div><div class="tok" style="color:var(--cream-400);margin-top:8px">4</div><div class="tok" style="color:var(--sage-600)">--space-1</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--brass-500)"></div><div class="tok" style="color:var(--cream-400);margin-top:8px">8</div><div class="tok" style="color:var(--sage-600)">--space-2</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--brass-500)"></div><div class="tok" style="color:var(--cream-400);margin-top:8px">12</div><div class="tok" style="color:var(--sage-600)">--space-3</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--brass-500)"></div><div class="tok" style="color:var(--cream-400);margin-top:8px">16</div><div class="tok" style="color:var(--sage-600)">--space-4</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--brass-500)"></div><div class="tok" style="color:var(--cream-400);margin-top:8px">24</div><div class="tok" style="color:var(--sage-600)">--space-5</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--brass-500)"></div><div class="tok" style="color:var(--cream-400);margin-top:8px">32</div><div class="tok" style="color:var(--sage-600)">--space-6</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--brass-500)"></div><div class="tok" style="color:var(--cream-400);margin-top:8px">48</div><div class="tok" style="color:var(--sage-600)">--space-7</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--brass-500)"></div><div class="tok" style="color:var(--cream-400);margin-top:8px">64</div><div class="tok" style="color:var(--sage-600)">--space-8</div></div>
</div></body></html>
