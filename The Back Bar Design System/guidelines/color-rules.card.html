<!-- @dsCard group="Colors" viewport="700x150" name="Rules & washes" subtitle="Brass at fixed alphas — the only tints in the system" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--green-900);color:var(--cream-100);font-family:var(--font-body);padding:18px 22px}
.sw{display:flex;gap:0}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;border-radius:2px}
.hex{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;opacity:0.9}
.tok{font-size:10px;letter-spacing:0.06em;opacity:0.75;margin-top:2px}
.cap{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.10em;color:var(--cream-400)}
.mut{color:var(--cream-400);font-size:13px}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div><div style="height:44px;background:var(--green-800);border:1px solid var(--rule-hairline)"></div><div class="tok" style="color:var(--cream-400);margin-top:6px">--rule-hairline<br>rgba(198,161,91,.30)</div></div>
<div><div style="height:44px;background:var(--green-800);border:1px solid var(--rule-strong)"></div><div class="tok" style="color:var(--cream-400);margin-top:6px">--rule-strong<br>rgba(198,161,91,.55)</div></div>
<div><div style="height:44px;background:var(--brass-wash);border:1px solid var(--rule-faint)"></div><div class="tok" style="color:var(--cream-400);margin-top:6px">--brass-wash<br>hover fill</div></div>
<div><div style="height:44px;background:var(--rose-wash);border:1px solid var(--rule-faint)"></div><div class="tok" style="color:var(--cream-400);margin-top:6px">--rose-wash<br>gap sections</div></div>
</div></body></html>
