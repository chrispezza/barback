<!-- @dsCard group="Colors" viewport="700x140" name="Absence, gap, removal" subtitle="Sage, rose and oxblood — never decorative" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--green-900);color:var(--cream-100);font-family:var(--font-body);padding:18px 22px}
.sw{display:flex;gap:0}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;border-radius:2px}
.hex{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;opacity:0.9}
.tok{font-size:10px;letter-spacing:0.06em;opacity:0.75;margin-top:2px}
.cap{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.10em;color:var(--cream-400)}
.mut{color:var(--cream-400);font-size:13px}
</style></head><body><div class="sw" style="gap:2px">
<div style="background:var(--sage-600)"><span class="hex" style="color:var(--green-900)">#9CAFA4</span><span class="tok" style="color:var(--green-900)">--sage-600 · you don't have it</span></div>
<div style="background:var(--rose-300)"><span class="hex" style="color:var(--green-900)">#D8A79A</span><span class="tok" style="color:var(--green-900)">--rose-300 · near-miss headers</span></div>
<div style="background:var(--rose-400)"><span class="hex" style="color:var(--green-900)">#C99287</span><span class="tok" style="color:var(--green-900)">--rose-400 · missing callouts</span></div>
<div style="background:var(--ox-700)"><span class="hex" style="color:var(--cream-100)">#5F2E33</span><span class="tok" style="color:var(--cream-100)">--ox-700 · destructive only</span></div>
</div></body></html>
