<!-- @dsCard group="Brand" viewport="700x190" name="Rules & frames" subtitle="1px hairline on cards; the double-rule is for frames only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--green-900);color:var(--cream-100);font-family:var(--font-body);padding:18px 22px}
.sw{display:flex;gap:0}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;border-radius:2px}
.hex{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;opacity:0.9}
.tok{font-size:10px;letter-spacing:0.06em;opacity:0.75;margin-top:2px}
.cap{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.10em;color:var(--cream-400)}
.mut{color:var(--cream-400);font-size:13px}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:26px">
<div><div style="background:var(--green-800);border:1px solid var(--rule-hairline);border-radius:2px;height:92px;padding:14px"><span style="font-family:var(--font-display);font-size:24px">Daiquiri</span></div><div class="tok" style="color:var(--cream-400);margin-top:8px">Card · 1px rgba(198,161,91,.30) · 2px radius</div></div>
<div><div style="border:3px solid var(--rule-strong);border-radius:2px;padding:4px;height:92px;box-sizing:border-box"><div style="border:1px solid var(--rule-hairline);height:100%;padding:10px;box-sizing:border-box"><span style="font-family:var(--font-display);font-size:24px">Add to shelf</span></div></div><div class="tok" style="color:var(--cream-400);margin-top:8px">Frame · 3px + 1px offset · modals & pages only</div></div>
</div></body></html>
