<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--green-900);color:var(--cream-100);font-family:var(--font-body);padding:18px 22px}
.sw{display:flex;gap:0}.sw>div{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;border-radius:2px}
.hex{font-size:10px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;opacity:0.9}
.tok{font-size:10px;letter-spacing:0.06em;opacity:0.75;margin-top:2px}
.cap{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:0.10em;color:var(--cream-400)}
.mut{color:var(--cream-400);font-size:13px}
</style></head><body><table style="width:100%;border-collapse:collapse;font-size:15px">
<tr><td style="padding:7px 0;width:110px"><span style="color:var(--brass-500);font-weight:700">Brass</span></td><td style="color:var(--cream-100)">You have it · selected · can pour</td></tr>
<tr><td style="padding:7px 0"><span style="color:var(--cream-100);font-weight:700">Cream</span></td><td class="mut" style="color:var(--cream-100)">Neutral content</td></tr>
<tr><td style="padding:7px 0"><span style="color:var(--sage-600);font-weight:700">Sage</span></td><td style="color:var(--cream-100)">You don't have it — calm absence, not an error</td></tr>
<tr><td style="padding:7px 0"><span style="color:var(--rose-400);font-weight:700">Rose</span></td><td style="color:var(--cream-100)">Actionable gap — one bottle away, shopping list</td></tr>
<tr><td style="padding:7px 0"><span style="color:var(--ox-700);font-weight:700">Oxblood</span></td><td style="color:var(--cream-100)">Removal only. Never decoration.</td></tr>
</table></body></html>
