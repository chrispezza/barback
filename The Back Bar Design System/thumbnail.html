<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{display:grid;grid-template-columns:75% 25%;width:1280px;height:854px;background:var(--green-900)}
.mark{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--green-900)}
.mark h1{margin:0;font-family:var(--font-display);font-size:150px;line-height:0.95;color:var(--cream-100);text-align:center}
.mark .fl{margin-top:28px;font-size:34px;color:var(--brass-500);letter-spacing:0.32em}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip div{width:100%;height:100%}</style></head>
<body><div class="mark"><h1>The<br>Back Bar</h1><div class="fl">◆</div></div>
<div class="strip"><div style="background:var(--cream-100)"></div><div style="background:var(--rose-300)"></div><div style="background:var(--brass-500)"></div><div style="background:var(--ox-700)"></div></div>
</body></html>
