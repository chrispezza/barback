</head><body><div id="root"></div>
<script type="text/babel">
const { ModalFrame, EmptyState, Toast, Button } = window.TheBackBarDesignSystem_3399bd;

function Demo(){
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px',alignItems:'start'}}>
    <ModalFrame eyebrow="Add to shelf" title="Rye whiskey"
      footer={<><Button variant="ghost" size="sm">Cancel</Button><Button size="sm">Add</Button></>}>
      <p style={{margin:0,fontSize:'15px',fontStyle:'italic',fontFamily:'var(--font-serif)',color:'var(--cream-400)'}}>Rittenhouse Bottled-in-Bond, 750ml. Opens six drinks.</p>
    </ModalFrame>
    <div>
      <EmptyState title="Nothing pours yet" body="Add a citrus and a sweetener and six drinks open up." action={<Button size="sm">Add a bottle</Button>}/>
    </div>
    <div style={{gridColumn:'1 / -1',display:'grid',gap:'2px'}}>
      <Toast message="Orgeat moved to the shelf." actionLabel="Undo"/>
      <Toast message="Rye whiskey removed from the shelf." actionLabel="Undo" tone="destructive"/>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
