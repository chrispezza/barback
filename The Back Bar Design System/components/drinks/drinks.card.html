<!-- @dsCard group="Components" viewport="700x420" name="Drinks" subtitle="Drink card match states, ratio device, match header" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}body{background:var(--green-900);color:var(--cream-100);font-family:var(--font-body);padding:20px 24px}.lbl{font-family:var(--font-body);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.10em;color:var(--sage-600);margin:0 0 8px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.cols{display:grid;grid-template-columns:repeat(1,1fr);gap:24px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { DrinkCard, RatioDevice, MatchHeader } = window.TheBackBarDesignSystem_3399bd;

const D=(n,f,ing,m)=><DrinkCard name={n} family={f} match={m} ingredients={ing}/>;
function Demo(){
  return (<div>
    <RatioDevice parts={[{value:'2',label:'Spirit'},{value:'¾',label:'Citrus'},{value:'¾',label:'Sweet'}]} size="md"/>
    <div style={{height:'18px'}}/>
    <MatchHeader label="Drinks" count={14}/>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginTop:'10px'}}>
      {D('Daiquiri','Sour',[{name:'White rum',have:true},{name:'Lime juice',have:true},{name:'Simple syrup',have:true}],'full')}
      {D('Sidecar','Sour',[{name:'Cognac',have:true},{name:'Lemon juice',have:true},{name:'Cointreau',have:false}],'near')}
    </div>
    <div style={{height:'14px'}}/>
    <MatchHeader label="One bottle away" count={6} tone="gap"/>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginTop:'10px'}}>
      {D('Mai Tai','Sour',[{name:'Aged rum',have:true},{name:'Lime juice',have:true},{name:'Orgeat',have:false},{name:'Curaçao',have:false}],'partial')}
      {D('Ramos Gin Fizz','Flip',[{name:'Gin',have:false},{name:'Cream',have:false},{name:'Orange flower water',have:false}],'none')}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
