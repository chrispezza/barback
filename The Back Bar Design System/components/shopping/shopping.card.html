</head><body><div id="root"></div>
<script type="text/babel">
const { ShoppingListItem, MatchHeader } = window.TheBackBarDesignSystem_3399bd;

function Demo(){
  const [done,setDone]=React.useState({orgeat:false,cointreau:true});
  return (<div>
    <MatchHeader label="Shopping list" count={3} tone="gap"/>
    <ShoppingListItem name="Orgeat" unlocks={4} note="any almond syrup" checked={done.orgeat} onToggle={()=>setDone({...done,orgeat:!done.orgeat})}/>
    <ShoppingListItem name="Cointreau" unlocks={6} checked={done.cointreau} onToggle={()=>setDone({...done,cointreau:!done.cointreau})}/>
    <ShoppingListItem name="Green Chartreuse" unlocks={2} note="no substitute"/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
