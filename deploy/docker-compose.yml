name: barback

services:
  # Single-origin front door (ADR-005): serves the built SPA and proxies
  # /bar/ → API, /search/ → Meilisearch. Build the bundle first: pnpm build:deploy
  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - bar-assistant
      - meilisearch
    ports:
      - "8080:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  bar-assistant:
    # Pinned per ADR-001 — bump deliberately, read the changelog, re-test.
    image: barassistant/server:5.15.3
    restart: unless-stopped
    depends_on:
      - meilisearch
      - redis
    environment:
      # Public base URL of the API behind the front door — set BARBACK_ORIGIN in
      # deploy/.env to http://<lan-ip>:8080 for phone access on the LAN.
      APP_URL: ${BARBACK_ORIGIN:-http://localhost:8080}/bar
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:?set in deploy/.env}
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      # Off by default: create your user on first boot (see README), then it
      # stays closed. Anyone on the network can otherwise mint an account.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-"false"}
    ports:
      # Loopback only — the LAN sees nothing but the :8080 front door.
      # Dev (pnpm dev) talks to localhost:8000 from this machine, unaffected.
      - "127.0.0.1:8000:8080"
    volumes:
      # All state: SQLite database + uploads. Back this up (ADR-005).
      - bar_data:/var/www/cocktails/storage/bar-assistant

  # Admin/reference UI (upstream client). Barback replaces this for daily use.
  salt-rim:
    image: barassistant/salt-rim:v4
    restart: unless-stopped
    depends_on:
      - bar-assistant
    environment:
      API_URL: http://localhost:8000
      MEILISEARCH_URL: http://localhost:7700
    ports:
      - "127.0.0.1:3000:8080"

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set in deploy/.env}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  bar_data:
  meili_data:
